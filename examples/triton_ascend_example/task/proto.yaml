operator:
  name: FusedAddRelu
  category: Elementwise
  difficulty: L1
  description: 相同 shape、dtype、NPU device 的有限数值输入，先在 float32 相加并 ReLU，再转回输入 dtype；不支持广播。
  formula: output = cast(max(float32(x) + float32(y), 0), input_dtype)
  shape_support: 输入形状相同，输出形状不变
  inputs:
    - name: x
      dtype: [float16, bfloat16, float32]
    - name: y
      dtype: [float16, bfloat16, float32]
  outputs:
    - name: output
      dtype: [float16, bfloat16, float32]
  schema: fused_add_relu(Tensor x, Tensor y) -> Tensor output
