operator:
  name: FusedAddRelu
  category: Elementwise
  difficulty: L1
  description: Finite-valued inputs with the same shape, dtype and NPU device; add in float32 and apply ReLU, then cast back to the input dtype; broadcasting is not supported.
  formula: output = cast(max(float32(x) + float32(y), 0), input_dtype)
  shape_support: inputs have identical shapes; the output shape is unchanged
  inputs:
    - name: x
      dtype: [float16, bfloat16, float32]
    - name: y
      dtype: [float16, bfloat16, float32]
  outputs:
    - name: output
      dtype: [float16, bfloat16, float32]
  schema: fused_add_relu(Tensor x, Tensor y) -> Tensor output
