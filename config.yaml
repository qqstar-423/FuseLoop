# Triton Ascend Workflow unified configuration (read by the program; tracked in Git)
# Workflow parameters, tool paths, Jev connection and keys are all kept in this file; when migrating machines, just edit this file.

# ═══════════════════════════════════════════════════
# Workflow control
# ═══════════════════════════════════════════════════
workflow:
  max_iterations: 20
  recent_iterations_window: 5
  human_review:
    proactive_enabled: true
    consultation_enabled: true
    # Third stall escalation; wait 2 minutes; upon receiving a wait instruction, the wait may be extended once more by 10 minutes.
  semantic_exit:
    # x of Scenario 1: when every case in this round has speedup >= 1 and, across x consecutive valid iterations,
    # the cumulative improvement of the best avg_speedup is < 5%, end the optimization and deliver the best compliant implementation.
    passed_window: 3
    # y of Scenario 2: when at least one case in this round has speedup < 1 and, across y consecutive valid iterations,
    # the cumulative improvement of the best avg_speedup is < 5%, Stage9 re-reviews the plan instead of exiting directly / force-switching plans.
    underperforming_window: 3
    # Both require "one valid baseline + x/y valid results"; invalid evaluations do not count, and a change in compliance status resets the window.
    # 5% is a fixed threshold; x/y are neither the number of scenario entries nor the number of stalls before the third human consultation.

# Number of fusion plans selected by Jev probability in stage1.5 (1–10).
fusion_selection:
  top_n: 3
  # stage1.5 reuses agents.kerminal.cli, translating all non-English material before submitting to Jev.
  translation_timeout_seconds: 240

# Jev invocation configuration; used by stage1.5 and reused by standalone invocation tools as well.
jev:
  base_url: "https://api.typesafe.ai"
  model: "jev-1.13.0"
  # Read the environment variable first; fall back to api_key below when it is unset — no second YAML needed.
  api_key_env: "TYPESAFE_API_KEY"
  api_key: ""
  timeout_seconds: 30
  max_retries: 1
  # UTF-8 JSON byte pre-check, not an exact token count; leaves headroom under the 32K / 64K limits.
  max_state_question_bytes: 28000
  max_request_bytes: 56000

# ═══════════════════════════════════════════════════
# Agent configuration
# ═══════════════════════════════════════════════════
agents:
  cannbot:
    cli: "/home/developer/.nvm/versions/node/v18.19.1/bin/cannbot"
    # API key configured at: /root/.config/opencode/opencode.jsonc
    # Model: glm-5.3-flash

  kerminal:
    cli: "/home/developer/.local/bin/kerminal"
    # API key configured at: ~/.kerminal/config.toml
    # Model: kernelcat1.0

  hermes:
    cli: "/home/developer/.hermes/venvs/hermes-dev/bin/hermes"
    # API key and model configured at: ~/.hermes/config.yaml
    # Model: glm-5.3-flash

# ═══════════════════════════════════════════════════
# Hardware
# ═══════════════════════════════════════════════════
hardware:
  device_id: 0
  # chip_model / soc_version / npu_arch are auto-detected at orchestrator startup
  # and written to <work>/device_info.json, injected into every stage's prompt
  # To override manually (e.g., a remote machine cannot auto-detect), uncomment the fields below:
  # chip_model: "Ascend 950"
  # soc_version: "Ascend910B4"
  # npu_arch: "dav-3510"
  # arch_key: "a5"
  # Triton Ascend uses block-program programming; the program verifies the actual NPU backend and runtime version at startup.
  # ai_core_num: 32
  # ub_size_kb: 248
  # l1_size_kb: 1024
  # l0a_size_kb: 64
  # l0b_size_kb: 64
  # l0c_size_kb: 256

# ═══════════════════════════════════════════════════
# Paths
# ═══════════════════════════════════════════════════
paths:
  cannbench_repo: "/mnt/workspace/cann-bench"

# ═══════════════════════════════════════════════════
# CANN environment (eliminates all hardcoded paths)
# When migrating to a new machine, change only here; concrete version numbers and architectures no longer appear in code
# ═══════════════════════════════════════════════════
cann:
  toolkit_path: "/home/developer/Ascend/cann-9.1.0"
  driver_path: "/usr/local/Ascend/driver"
  arch: "aarch64-linux"
  node_bin: "/home/developer/.nvm/versions/node/v18.19.1/bin"

# ═══════════════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════════════
logging:
  level: "DEBUG"
  console_level: "INFO"
